services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solarplan}
      POSTGRES_USER: ${POSTGRES_USER:-solarplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solarplan_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solarplan} -d ${POSTGRES_DB:-solarplan}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SOLARPLAN_ENVIRONMENT: ${SOLARPLAN_ENVIRONMENT:-development}
      SOLARPLAN_DATABASE_URL: ${SOLARPLAN_DATABASE_URL:-postgresql+asyncpg://solarplan:solarplan_local_password@db:5432/solarplan}
      SOLARPLAN_CORS_ORIGINS: ${SOLARPLAN_CORS_ORIGINS:-["http://localhost:5173"]}
      SOLARPLAN_JWT_SECRET: ${SOLARPLAN_JWT_SECRET:-local-development-secret-change-before-deployment}
      SOLARPLAN_ACCESS_TOKEN_EXPIRE_MINUTES: ${SOLARPLAN_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      SOLARPLAN_GEOCODING_BASE_URL: ${SOLARPLAN_GEOCODING_BASE_URL:-https://nominatim.openstreetmap.org}
      SOLARPLAN_GEOCODING_USER_AGENT: ${SOLARPLAN_GEOCODING_USER_AGENT:-SolarPlan/0.1 (https://github.com/przuljp/SolarPlan)}
      SOLARPLAN_GEOCODING_REFERER: ${SOLARPLAN_GEOCODING_REFERER:-https://github.com/przuljp/SolarPlan}
      SOLARPLAN_GEOCODING_TIMEOUT_SECONDS: ${SOLARPLAN_GEOCODING_TIMEOUT_SECONDS:-10}
      SOLARPLAN_GEOCODING_MIN_INTERVAL_SECONDS: ${SOLARPLAN_GEOCODING_MIN_INTERVAL_SECONDS:-1}
      SOLARPLAN_GEOCODING_CACHE_TTL_SECONDS: ${SOLARPLAN_GEOCODING_CACHE_TTL_SECONDS:-3600}
      SOLARPLAN_PVGIS_BASE_URL: ${SOLARPLAN_PVGIS_BASE_URL:-https://re.jrc.ec.europa.eu/api/v5_3}
      SOLARPLAN_PVGIS_VERSION: ${SOLARPLAN_PVGIS_VERSION:-5.3}
      SOLARPLAN_PVGIS_TIMEOUT_SECONDS: ${SOLARPLAN_PVGIS_TIMEOUT_SECONDS:-20}
      SOLARPLAN_PVGIS_MAX_RETRIES: ${SOLARPLAN_PVGIS_MAX_RETRIES:-2}
      SOLARPLAN_PVGIS_RETRY_BACKOFF_SECONDS: ${SOLARPLAN_PVGIS_RETRY_BACKOFF_SECONDS:-0.5}
      SOLARPLAN_PVGIS_DEFAULT_SYSTEM_LOSS_PERCENT: ${SOLARPLAN_PVGIS_DEFAULT_SYSTEM_LOSS_PERCENT:-14}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
      VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:

